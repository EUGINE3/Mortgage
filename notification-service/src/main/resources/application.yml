spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://postgres:5432/notification
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  kafka:
    topic: loan.applications
    dlq-topic: loan.applications.dlq
    dlq-group-id: notification-service-dlq
    retry:
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000
      max-elapsed-ms: 30000
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:noreply@bank.com}

logging:
  level:
    root: INFO
    com.bank.notification: DEBUG
