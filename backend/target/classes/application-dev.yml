spring:
  application:
    name: mortgage-service

  datasource:
    url: jdbc:postgresql://postgres:5432/mortgage_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.batch_size: 10
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      acks: all
      retries: 3

  flyway:
    enabled: false
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  autoconfigure:
    exclude:
      - io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration

server:
  port: 8080

logging:
  level:
    root: DEBUG
    com.bank.mortgage: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: 9f2c7a1d6b8e4f3c9a0d8e7f6b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c
    expiration-ms: 3600000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

otel:
  sdk:
    disabled: true
